[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proxyforge"
dynamic = ["version"]
description = "A small, readable web security testing proxy (clean-room, Burp-style features)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
proxyforge = "proxyforge.cli:main"

[tool.setuptools]
packages = ["proxyforge"]

[tool.setuptools.dynamic]
version = { attr = "proxyforge.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
